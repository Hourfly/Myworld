<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0d1a"><title>Live Tracking | MyWorld</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0a0d1a;--card:#141a2e;--line:#29324d;--txt:#f2f4fa;--muted:#a3abc2;--accent:#a99bff;--mint:#4fd1c5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px Inter,system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px 16px 60px}.top{display:flex;align-items:center;gap:12px;margin-bottom:26px}.top a{color:var(--accent);text-decoration:none}.top strong{margin-right:auto}.hero{padding:20px;border-radius:18px;background:linear-gradient(110deg,#2a2470,#203d68 55%,#0f5c63);margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:26px}.muted{color:var(--muted);line-height:1.5;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px}.panel h2{font-size:17px;margin:0 0 14px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;min-height:43px;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font:inherit}.field textarea{min-height:80px;resize:vertical}.btn{border:0;border-radius:11px;padding:12px 16px;background:linear-gradient(100deg,var(--accent),var(--mint));font-weight:800;color:#08101b;cursor:pointer}.btn.secondary{background:#252e4b;color:var(--txt);border:1px solid var(--line)}.btn:disabled{opacity:.5}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.status{font-size:12px;color:var(--mint);min-height:16px}.ship{padding:13px;border:1px solid var(--line);border-radius:12px;margin:9px 0}.ship strong{display:block;margin-bottom:5px}.ship small{color:var(--muted)}.tag{font-size:10px;color:var(--mint);text-transform:uppercase;font-weight:800}.hidden{display:none!important}#qrBox{background:#fff;padding:12px;display:inline-block;border-radius:10px}#qrBox img,#qrBox canvas{max-width:180px;height:auto}.contents-preview{display:flex;gap:8px;flex-wrap:wrap}.contents-preview img{width:70px;height:70px;object-fit:cover;border-radius:9px}.result{margin-top:15px;padding:14px;border:1px dashed var(--accent);border-radius:12px;overflow-wrap:anywhere}.result a{color:var(--accent)}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:14px 12px 40px}}
</style></head><body><main class="wrap">
<header class="top"><a href="index.html">← MyWorld</a><strong>Live Tracking</strong><span class="tag">SHIPMENT STUDIO</span></header>
<section class="hero"><h1>Your shipments, your way.</h1><div class="muted">Create a waybill, add shipment photos, schedule recipient updates and share a private tracking page.</div></section>
<section class="panel"><h2>Create a shipment</h2><form id="createForm">
<div class="grid">
<div class="field"><label>Shipment title *</label><input name="title" required placeholder="e.g. Personal effects"></div>
<div class="field"><label>Transport type *</label><select name="transport_type"><option value="air">Aircraft</option><option value="sea">Cargo ship</option><option value="road">Road vehicle</option></select></div>
<div class="field"><label>Sender name *</label><input name="sender_name" required></div>
<div class="field"><label>Recipient name *</label><input name="recipient_name" required></div>
<div class="field"><label>Recipient email (optional)</label><input name="recipient_email" type="email"></div>
<div class="field"><label>Tracking password * (minimum 8 characters)</label><input name="password" type="password" minlength="8" required autocomplete="new-password"></div>
<div class="field"><label>Origin *</label><input name="origin" required placeholder="City, country"></div>
<div class="field"><label>Destination *</label><input name="destination" required placeholder="City, country"></div>
<div class="field"><label>Departure date & time *</label><input name="departure_at" type="datetime-local" required></div>
<div class="field"><label>Estimated arrival date & time *</label><input name="arrival_at" type="datetime-local" required></div>
</div>
<div class="field"><label>Shipment description</label><textarea name="description" placeholder="Additional information about this shipment"></textarea></div>
<div class="field"><label>Photos of shipment contents (JPG, PNG or WebP; up to 10 MB each)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="previews" class="contents-preview"></div></div>
<div class="field"><label>Scheduled live-feed announcement (optional)</label><textarea name="feed_message" placeholder="Example: Your shipment has departed the origin facility."></textarea></div>
<div class="field"><label>Show this announcement at</label><input name="feed_time" type="datetime-local"></div>
<label class="muted"><input type="checkbox" name="show_contents" checked> Allow recipients to view shipment contents and photos</label>
<p id="formStatus" class="status" role="status"></p><button class="btn" id="createBtn">Create waybill & tracking link</button>
</form><div id="createdResult" class="result hidden"></div></section>
<section class="panel"><div class="row"><h2 style="margin-right:auto">My shipments</h2><button class="btn secondary" id="refreshBtn" type="button">Refresh</button></div><div id="shipmentList" class="muted">Loading your shipments…</div></section>
</main>
<script>
const API='https://wjffjcaloydlkcuxychf.supabase.co',KEY='sb_publishable_sFkmhaGDNPfyyMMs5tiagQ_RBCZAOUB',STORE='sb-wjffjcaloydlkcuxychf-auth-token';
let session=null;const $=id=>document.getElementById(id);const fn=API+'/functions/v1/shipment-service';
async function boot(){try{session=JSON.parse(localStorage.getItem(STORE)||'null')}catch{}if(!session?.access_token){location.href='auth.html';return}const r=await fetch(API+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+session.access_token}});if(!r.ok){location.href='auth.html';return}loadShipments()}
async function call(action,data={}){const r=await fetch(fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action,...data})});const d=await r.json();if(!r.ok)throw Error(d.error||'Shipment service error');return d}
$('photos').addEventListener('change',()=>{$('previews').innerHTML='';for(const f of [...$('photos').files]){const img=document.createElement('img');img.src=URL.createObjectURL(f);$('previews').append(img)}});
async function uploadPhotos(userId,shipmentId){const files=[...$('photos').files];const out=[];for(let i=0;i<files.length;i++){const f=files[i];if(f.size>10*1024*1024)throw Error(f.name+' exceeds 10 MB');const ext=f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg';const path=userId+'/'+shipmentId+'/'+crypto.randomUUID()+'.'+ext;const r=await fetch(API+'/storage/v1/object/shipment-images/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':f.type,'x-upsert':'false'},body:f});if(!r.ok)throw Error('Could not upload '+f.name);out.push({description:f.name,quantity:1,image_path:path})}return out}
$('createForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('createBtn');btn.disabled=true;btn.textContent='Creating shipment…';$('formStatus').textContent='';$('createdResult').classList.add('hidden');try{
const fd=new FormData(e.currentTarget),p=Object.fromEntries(fd.entries());p.show_contents=fd.has('show_contents');p.departure_at=new Date(p.departure_at).toISOString();p.arrival_at=new Date(p.arrival_at).toISOString();const feedMessage=p.feed_message,feedTime=p.feed_time;delete p.feed_message;delete p.feed_time;
const {data:{user}}=await (await fetch(API+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+session.access_token}})).json().then(x=>({data:{user:x}}));
const pre={...p,contents:[],feed:feedMessage&&feedTime?[{message:feedMessage,publish_at:new Date(feedTime).toISOString()}]:[]};
const created=await call('create',{shipment:pre});let contents=[];try{contents=await uploadPhotos(user.id,created.shipment.id)}catch(err){$('formStatus').textContent='Shipment created, but image upload needs attention: '+err.message}
if(contents.length){const rr=await call('add-contents',{shipment_id:created.shipment.id,contents})}
showCreated(created);e.currentTarget.reset();$('previews').innerHTML='';await loadShipments();$('formStatus').textContent='Waybill and tracking credentials created.'}
catch(err){$('formStatus').textContent=err.message}finally{btn.disabled=false;btn.textContent='Create waybill & tracking link'}});
function showCreated(d){const link='https://track.myworld.com/track.html?code='+encodeURIComponent(d.shipment.tracking_code);const qr='https://track.myworld.com/track.html?code='+encodeURIComponent(d.shipment.tracking_code)+'&qr='+encodeURIComponent(d.qr_token);const box=$('createdResult');box.classList.remove('hidden');box.innerHTML='<strong>Shipment created — '+d.shipment.tracking_code+'</strong><p class="muted">Share the tracking link and password separately. QR access opens directly, so share the QR only with the intended recipient.</p><p><a href="'+link+'" target="_blank" rel="noopener">Open password-protected tracking page ↗</a></p><div class="row"><button class="btn secondary" id="copyLink">Copy tracking link</button><button class="btn secondary" id="printWaybill">Print waybill</button></div><p style="margin-top:14px;color:#111">QR code — direct access</p><div id="qrBox"></div><p class="muted">Keep this QR code private. Anyone who scans it can view this shipment until its access token expires or is revoked.</p>';new QRCode($('qrBox'),{text:qr,width:180,height:180});$('copyLink').onclick=()=>navigator.clipboard.writeText(link);$('printWaybill').onclick=()=>printWaybill(d.shipment,link)}
function printWaybill(s,link){const w=window.open('','_blank');w.document.write('<html><head><title>Waybill '+s.tracking_code+'</title></head><body style="font:14px Arial;padding:30px"><h1>SHIPMENT WAYBILL</h1><h2>'+s.tracking_code+'</h2><p><b>Shipment:</b> '+s.title+'</p><p><b>Recipient:</b> '+s.recipient_name+'</p><p><b>Origin:</b> '+s.origin+'</p><p><b>Destination:</b> '+s.destination+'</p><p><b>Transport:</b> '+s.transport_type+'</p><p><b>Departure:</b> '+new Date(s.departure_at).toLocaleString()+'</p><p><b>Estimated arrival:</b> '+new Date(s.arrival_at).toLocaleString()+'</p><p><b>Private tracking:</b> '+link+'</p><p>Recipient password is shared separately.</p><button onclick="print()">Print / Save PDF</button></body></html>');w.document.close()}
async function loadShipments(){try{const d=await call('list');$('shipmentList').innerHTML=d.shipments.length?d.shipments.map(s=>'<div class="ship"><strong>'+escapeHtml(s.title)+' · '+escapeHtml(s.tracking_code)+'</strong><small>'+escapeHtml(s.origin)+' → '+escapeHtml(s.destination)+' · '+new Date(s.arrival_at).toLocaleDateString()+'</small><div class="tag">'+escapeHtml(s.status)+'</div></div>').join(''):'No shipments yet. Create your first waybill above.'}catch(e){$('shipmentList').textContent=e.message}}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('refreshBtn').onclick=loadShipments;boot();
</script></body></html>
