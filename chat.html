<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54"><title>Shipment Chat | MyWorld</title>
<style>
:root{color-scheme:light;--bg:#f3f6fc;--line:#e1e7f0;--muted:#68758c;--text:#172033}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,sans-serif;color-scheme:light}
.chat-app{height:100dvh;display:flex;flex-direction:column;max-width:1000px;margin:auto;background:#f3f6fc}
.header{height:70px;flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line)}
.back{color:#0755ed;text-decoration:none;font-size:27px;padding:4px}.avatar{width:43px;height:43px;flex:none;display:grid;place-items:center;border-radius:50%;background:#e8efff;color:#0755ed;font-weight:900;font-size:13px}
.identity{min-width:0;flex:1}.identity strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity small{display:block;color:#68758c;font-size:11px;margin-top:3px}.header-actions{color:#68758c;font-size:20px}
.notice{flex:none;padding:8px 12px;text-align:center;background:#eaf0f7;color:#59677e;font-size:10px;line-height:1.4}
.messages{flex:1;overflow-y:auto;padding:16px 12px 22px;background-color:#f3f6fc;background-image:radial-gradient(#17203308 1px,transparent 1px);background-size:18px 18px;scroll-behavior:smooth}
.day{text-align:center;margin:4px 0 18px}.day span{display:inline-block;padding:6px 11px;border-radius:8px;background:#fff;color:#59677e;font-size:10px}
.message-row{display:flex;margin:7px 0}.message-row.mine{justify-content:flex-end}.bubble{max-width:min(82%,560px);padding:9px 11px 6px;border-radius:14px;background:#fff;color:#172033;box-shadow:0 1px 3px #17203312;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.4}.mine .bubble{background:#dff4e7;color:#173c2b}.message-text{font-size:14px}.meta{display:flex;justify-content:flex-end;gap:5px;margin-top:4px;color:#68758c;font-size:9px}.ticks{color:#087eaa;font-size:12px}
.empty-state{max-width:290px;margin:12vh auto 0;padding:20px;border-radius:14px;background:#fff;text-align:center;color:#59677e;font-size:13px;line-height:1.55}
.composer{flex:none;display:flex;align-items:flex-end;gap:9px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none;padding:12px 15px;border:1px solid #e1e7f0;outline:0;border-radius:24px;background:#f1f4f9;color:#172033;font:inherit;font-size:14px;line-height:1.4}
.send{width:45px;height:45px;flex:none;border:0;border-radius:50%;background:#087eaa;color:white;font-size:19px;font-weight:900;cursor:pointer}.send:disabled{opacity:.45}
.error{flex:none;padding:8px 14px;background:#fff0f1;color:#9d2638;font-size:12px;display:none}
.attach{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:#e8eef7;color:#087eaa;font-size:27px;cursor:pointer}.chat-image{display:block;max-width:min(70vw,320px);max-height:360px;border-radius:12px;object-fit:contain}
@media(min-width:700px){body{background:#f3f6fc}.chat-app{border-left:1px solid #e1e7f0;border-right:1px solid #e1e7f0}.messages{padding-left:clamp(18px,8vw,90px);padding-right:clamp(18px,8vw,90px)}}
</style>
</head>
<body>
<main class="chat-app">
<header class="header"><a class="back" id="backLink" href="track.html" aria-label="Back">‹</a><div class="avatar" id="avatar">MW</div><div class="identity"><strong id="chatTitle">Shipment Support</strong><small id="subtitle">MyWorld shipment conversation</small></div><div class="header-actions" aria-hidden="true">⋮</div></header>
<div class="notice">MyWorld shipment chat · Private shipment conversation with the assigned shipping company.</div>
<div class="error" id="error" role="status"></div>
<section class="messages" id="messages" aria-live="polite"><div class="empty-state">Opening your secure shipment conversation…</div></section>
<form class="composer" id="composer"><label class="attach" for="imageInput" aria-label="Attach image">＋</label><input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden><textarea id="messageInput" rows="1" maxlength="4000" placeholder="Message" aria-label="Message"></textarea><button class="send" id="sendButton" type="submit" aria-label="Send message">➤</button></form>
</main>
<script>
const API='https://wjffjcaloydlkcuxychf.supabase.co',KEY='sb_publishable_sFkmhaGDNPfyyMMs5tiagQ_RBCZAOUB',STORE='sb-wjffjcaloydlkcuxychf-auth-token',FN=API+'/functions/v1/shipment-service';
const params=new URLSearchParams(location.search),shipmentId=params.get('shipment_id')||'',$=id=>document.getElementById(id);
let role=null,chatToken='',session=null,lastSignature=null,timer=null,chatMode=params.get('mode')||'';
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showError(message){$('error').textContent=message;$('error').style.display='block'}
async function api(action,data={}){const headers={'apikey':KEY,'Content-Type':'application/json'};if(chatMode==='owner'&&session?.access_token)headers.Authorization='Bearer '+session.access_token;if(chatMode==='recipient'&&chatToken)headers['x-chat-token']=chatToken;const r=await fetch(FN,{method:'POST',headers,body:JSON.stringify({action,shipment_id:shipmentId,chat_mode:chatMode,...data})});const d=await r.json();if(!r.ok)throw Error(d.error||'Chat service unavailable');return d}
function time(value){return new Date(value).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function render(messages){const signature=messages.map(m=>m.id+':'+m.read_at).join('|');if(signature===lastSignature)return;const box=$('messages'),wasBottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;lastSignature=signature;try{localStorage.setItem('mw-chat-cache-'+chatMode+'-'+shipmentId,JSON.stringify({role,messages,cached_at:Date.now()}))}catch{}
if(!messages.length){box.innerHTML='<div class="empty-state">This is the beginning of your shipment conversation. Send a message to get started.</div>';return}
box.innerHTML='<div class="day"><span>'+new Date().toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'})+'</span></div>'+messages.map(m=>{const mine=m.sender_role===role;return '<div class="message-row '+(mine?'mine':'')+'"><div class="bubble"><div class="message-text">'+(m.image_url?'<img class="chat-image" src="'+escapeHtml(m.image_url)+'" alt="Image attachment" loading="lazy">':escapeHtml(m.body))+'</div><div class="meta">'+time(m.created_at)+(mine?'<span class="ticks">'+(m.read_at?'✓✓':'✓')+'</span>':'')+'</div></div></div>'}).join('');
if(wasBottom||messages.length<3)box.scrollTop=box.scrollHeight}
let refreshing=false;async function refresh(){if(refreshing)return;refreshing=true;try{const d=await api('chat-history');role=d.role;if(d.chat_title)$('chatTitle').textContent=d.chat_title;$('subtitle').textContent=role==='owner'?'Replying as '+(d.company_support_name||d.company_name||'Shipping company')+' · Recipient: '+(d.recipient_name||'Recipient'):'Assigned company · '+(d.company_name||'Shipping company')+' support';$('avatar').textContent=(role==='owner'?(d.company_support_name||d.company_name):(d.company_name||'MW')||'MW').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();render(d.messages||[])}catch(e){showError(e.message)}finally{refreshing=false}}
async function boot(){if(!shipmentId){showError('A shipment reference is missing.');return}try{try{session=JSON.parse(localStorage.getItem(STORE)||'null')}catch{}chatToken=sessionStorage.getItem('mw-chat-'+shipmentId)||localStorage.getItem('mw-chat-token-'+shipmentId)||'';if(!chatMode)chatMode=chatToken?'recipient':'owner';if(chatMode==='recipient'){try{const trackUrl=localStorage.getItem('mw-track-url-'+shipmentId);if(trackUrl)$('backLink').href=trackUrl}catch{}}if(chatMode==='recipient'&&!chatToken)throw Error('Open the tracking link and enter its password first to access this chat.');if(chatMode==='owner'&&(!session?.access_token))throw Error('Sign in to reply to shipment recipients.');try{const cached=JSON.parse(localStorage.getItem('mw-chat-cache-'+chatMode+'-'+shipmentId)||'null');if(cached&&Array.isArray(cached.messages)){role=cached.role;render(cached.messages)}}catch{}await refresh();if(!timer)timer=setInterval(refresh,5000)}catch(e){showError(e.message)}}
async function sendImage(file){if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>4*1024*1024){showError('Choose a JPG, PNG or WebP image up to 4 MB.');return}$('sendButton').disabled=true;try{const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});const uploaded=await api('chat-upload',{image_data:dataUrl});await api('chat-send',{image_path:uploaded.path});await refresh()}catch(e){showError(e.message)}finally{$('sendButton').disabled=false;$('imageInput').value=''}}$('imageInput').addEventListener('change',e=>sendImage(e.target.files?.[0]));
$('composer').addEventListener('submit',async e=>{e.preventDefault();const input=$('messageInput'),message=input.value.trim();if(!message)return;$('sendButton').disabled=true;try{await api('chat-send',{message});input.value='';input.style.height='44px';await refresh()}catch(e){showError(e.message)}finally{$('sendButton').disabled=false;input.focus()}});
$('messageInput').addEventListener('input',()=>{$('messageInput').style.height='44px';$('messageInput').style.height=Math.min($('messageInput').scrollHeight,120)+'px'});
$('backLink').href=chatMode==='owner'?'index.html#inbox':'track.html';
window.addEventListener('pagehide',()=>{if(timer)clearInterval(timer)});
boot();
</script>
</body></html>
