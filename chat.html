<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54"><title>Shipment Chat | MyWorld</title>
<style>
:root{color-scheme:dark;--green:#075e54;--sent:#005c4b;--bg:#0b141a;--panel:#111b21;--line:#26343b;--muted:#9aaab2;--text:#e9edef}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,sans-serif}
.chat-app{height:100dvh;display:flex;flex-direction:column;max-width:1000px;margin:auto;background:#0b141a}
.header{height:68px;flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;background:#202c33;border-bottom:1px solid #34434b}
.back{color:#d8e1e5;text-decoration:none;font-size:25px;padding:4px}.avatar{width:43px;height:43px;flex:none;display:grid;place-items:center;border-radius:50%;background:#dce8e7;color:#075e54;font-weight:900;font-size:13px}
.identity{min-width:0;flex:1}.identity strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity small{display:block;color:#b6c4ca;font-size:11px;margin-top:3px}.header-actions{color:#d9e2e6;font-size:20px}
.notice{flex:none;padding:7px 12px;text-align:center;background:#18252c;color:#c1cbd0;font-size:10px;line-height:1.4}
.messages{flex:1;overflow-y:auto;padding:16px 12px 22px;background-color:#0b141a;background-image:radial-gradient(#ffffff08 1px,transparent 1px);background-size:18px 18px;scroll-behavior:smooth}
.day{text-align:center;margin:4px 0 18px}.day span{display:inline-block;padding:6px 11px;border-radius:8px;background:#18252c;color:#c5d0d5;font-size:10px}
.message-row{display:flex;margin:7px 0}.message-row.mine{justify-content:flex-end}.bubble{max-width:min(82%,560px);padding:9px 11px 6px;border-radius:10px;background:#202c33;box-shadow:0 1px 1px #0004;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.4}.mine .bubble{background:#005c4b}.message-text{font-size:14px}.meta{display:flex;justify-content:flex-end;gap:5px;margin-top:4px;color:#aab9be;font-size:9px}.ticks{color:#53bdeb;font-size:12px}
.empty-state{max-width:290px;margin:12vh auto 0;padding:20px;border-radius:14px;background:#18252c;text-align:center;color:#c5d0d5;font-size:13px;line-height:1.55}
.composer{flex:none;display:flex;align-items:flex-end;gap:9px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#202c33}
.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none;padding:12px 15px;border:0;outline:0;border-radius:24px;background:#2a3942;color:#fff;font:inherit;font-size:14px;line-height:1.4}
.send{width:45px;height:45px;flex:none;border:0;border-radius:50%;background:#00a884;color:white;font-size:19px;font-weight:900;cursor:pointer}.send:disabled{opacity:.45}
.error{flex:none;padding:8px 14px;background:#48252c;color:#ffd8dd;font-size:12px;display:none}
@media(min-width:700px){body{background:#071016}.chat-app{border-left:1px solid #26343b;border-right:1px solid #26343b}.messages{padding-left:clamp(18px,8vw,90px);padding-right:clamp(18px,8vw,90px)}}
</style>
</head>
<body>
<main class="chat-app">
<header class="header"><a class="back" id="backLink" href="track.html" aria-label="Back">‹</a><div class="avatar" id="avatar">MW</div><div class="identity"><strong id="chatTitle">Shipment Support</strong><small id="subtitle">MyWorld shipment conversation</small></div><div class="header-actions" aria-hidden="true">⋮</div></header>
<div class="notice">MyWorld shipment chat · This is a private conversation between the recipient and the shipment creator. It is not the carrier's official support channel.</div>
<div class="error" id="error" role="status"></div>
<section class="messages" id="messages" aria-live="polite"><div class="empty-state">Opening your secure shipment conversation…</div></section>
<form class="composer" id="composer"><textarea id="messageInput" rows="1" maxlength="4000" placeholder="Message" aria-label="Message"></textarea><button class="send" id="sendButton" type="submit" aria-label="Send message">➤</button></form>
</main>
<script>
const API='https://wjffjcaloydlkcuxychf.supabase.co',KEY='sb_publishable_sFkmhaGDNPfyyMMs5tiagQ_RBCZAOUB',STORE='sb-wjffjcaloydlkcuxychf-auth-token',FN=API+'/functions/v1/shipment-service';
const params=new URLSearchParams(location.search),shipmentId=params.get('shipment_id')||'',$=id=>document.getElementById(id);
let role=null,chatToken='',session=null,lastSignature='',timer=null;
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showError(message){$('error').textContent=message;$('error').style.display='block'}
async function api(action,data={}){const headers={'apikey':KEY,'Content-Type':'application/json'};if(session?.access_token)headers.Authorization='Bearer '+session.access_token;if(chatToken)headers['x-chat-token']=chatToken;const r=await fetch(FN,{method:'POST',headers,body:JSON.stringify({action,shipment_id:shipmentId,...data})});const d=await r.json();if(!r.ok)throw Error(d.error||'Chat service unavailable');return d}
function time(value){return new Date(value).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function render(messages){const signature=messages.map(m=>m.id+':'+m.read_at).join('|');if(signature===lastSignature)return;const box=$('messages'),wasBottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;lastSignature=signature;
if(!messages.length){box.innerHTML='<div class="empty-state">This is the beginning of your shipment conversation. Send a message to get started.</div>';return}
box.innerHTML='<div class="day"><span>'+new Date().toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'})+'</span></div>'+messages.map(m=>{const mine=m.sender_role===role;return '<div class="message-row '+(mine?'mine':'')+'"><div class="bubble"><div class="message-text">'+escapeHtml(m.body)+'</div><div class="meta">'+time(m.created_at)+(mine?'<span class="ticks">'+(m.read_at?'✓✓':'✓')+'</span>':'')+'</div></div></div>'}).join('');
if(wasBottom||messages.length<3)box.scrollTop=box.scrollHeight}
async function refresh(){try{const d=await api('chat-history');role=d.role;if(d.chat_title)$('chatTitle').textContent=d.chat_title;$('subtitle').textContent=role==='owner'?'Chatting with shipment recipient':'Private shipment conversation';$('avatar').textContent=(d.carrier_name||'MW').slice(0,3).toUpperCase();render(d.messages||[])}catch(e){showError(e.message);if(timer){clearInterval(timer);timer=null}}}
async function boot(){if(!shipmentId){showError('A shipment reference is missing.');return}try{try{session=JSON.parse(localStorage.getItem(STORE)||'null')}catch{}chatToken=sessionStorage.getItem('mw-chat-'+shipmentId)||'';if(!session?.access_token&&!chatToken)throw Error('Open the tracking link and enter its password first to access this chat.');await refresh();if(!timer)timer=setInterval(refresh,3000)}catch(e){showError(e.message)}}
$('composer').addEventListener('submit',async e=>{e.preventDefault();const input=$('messageInput'),message=input.value.trim();if(!message)return;$('sendButton').disabled=true;try{await api('chat-send',{message});input.value='';input.style.height='44px';await refresh()}catch(e){showError(e.message)}finally{$('sendButton').disabled=false;input.focus()}});
$('messageInput').addEventListener('input',()=>{$('messageInput').style.height='44px';$('messageInput').style.height=Math.min($('messageInput').scrollHeight,120)+'px'});
$('backLink').href=history.length>1?'javascript:history.back()':'index.html';
window.addEventListener('pagehide',()=>{if(timer)clearInterval(timer)});
boot();
</script>
</body></html>
