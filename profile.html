<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A0D1A"><title>My Profile | MyWorld</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{color-scheme:dark;--bg:#0A0D1A;--card:#141A2E;--line:#232B47;--text:#F2F4FA;--muted:#A3ABC2;--violet:#A99BFF;--mint:#4FD1C5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:430px;margin:auto;padding:28px 18px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:34px}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--violet),var(--mint));color:#07121a;font-size:23px;font-weight:800}.brand b{font-size:21px}.card{padding:24px;border:1px solid var(--line);border-radius:22px;background:var(--card)}h1{font-size:26px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.info{padding:14px 0;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}.info span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.btn{width:100%;height:48px;margin-top:22px;border:1px solid #704b60;border-radius:13px;background:#301e32;color:#ffe3ee;font:inherit;font-weight:700}.back{display:inline-block;margin-top:20px;color:var(--violet);font-size:13px}</style></head><body><main class="wrap"><div class="brand"><span class="logo">M</span><b>MyWorld</b></div><section class="card"><h1>Your profile</h1><p class="muted">Your signed-in MyWorld account.</p><div class="info"><span>Full name</span><strong id="name">Loading…</strong></div><div class="info"><span>Email</span><strong id="email">Loading…</strong></div><div class="info"><span>Account ID</span><strong id="uid">Loading…</strong></div><button class="btn" id="signout">Sign out</button><p class="muted" id="status" role="status"></p></section><a class="back" href="index.html">← Back to MyWorld</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://wjffjcaloydlkcuxychf.supabase.co','sb_publishable_sFkmhaGDNPfyyMMs5tiagQ_RBCZAOUB');(async()=>{const {data,error}=await sb.auth.getUser();if(error||!data.user){location.replace('auth.html');return}const u=data.user;document.getElementById('name').textContent=u.user_metadata?.full_name||u.user_metadata?.name||'Not provided';document.getElementById('email').textContent=u.email||'—';document.getElementById('uid').textContent=u.id})();document.getElementById('signout').addEventListener('click',async()=>{const b=document.getElementById('signout');b.disabled=true;b.textContent='Signing out…';const {error}=await sb.auth.signOut();if(error){document.getElementById('status').textContent=error.message;b.disabled=false;b.textContent='Sign out'}else location.replace('auth.html')});</script></body></html>
